<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <rect width="480" height="400" rx="20" fill="#F6F2EA"/>

  <!-- 터미널 1층 도착장 -->
  <rect x="14" y="14" width="452" height="104" rx="14" fill="#DCE8F2"/>
  <text x="30" y="48" font-size="21" font-weight="800" fill="#1B4E8F">제주공항 1층 도착장</text>
  <text x="30" y="76" font-size="16" font-weight="700" fill="#33475B">① 짐 찾고 밖으로 나와요</text>
  <g font-size="13" font-weight="800" fill="#1B4E8F" text-anchor="middle">
    <text x="83" y="104">1</text><text x="168" y="104">2</text><text x="253" y="104">3</text><text x="338" y="104">4</text><text x="423" y="104">5</text>
  </g>
  <g fill="#FFFFFF" stroke="#9DB4CC" stroke-width="1.5">
    <rect x="60" y="110" width="46" height="12" rx="3"/><rect x="145" y="110" width="46" height="12" rx="3"/><rect x="230" y="110" width="46" height="12" rx="3"/><rect x="315" y="110" width="46" height="12" rx="3"/><rect x="400" y="110" width="46" height="12" rx="3"/>
  </g>
  <text x="466" y="38" font-size="12" font-weight="700" fill="#5C7896" text-anchor="end">출구 1–5번</text>

  <!-- 도착장 앞 도로 -->
  <rect x="0" y="180" width="480" height="58" fill="#CDD2D8"/>
  <line x1="0" y1="209" x2="480" y2="209" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="18 12"/>
  <g fill="#FFFFFF">
    <rect x="230" y="184" width="46" height="6" rx="1"/><rect x="230" y="195" width="46" height="6" rx="1"/><rect x="230" y="206" width="46" height="6" rx="1"/><rect x="230" y="217" width="46" height="6" rx="1"/><rect x="230" y="228" width="46" height="6" rx="1"/>
  </g>
  <rect x="300" y="194" width="160" height="30" rx="15" fill="#FFFFFF"/>
  <text x="380" y="214" font-size="13" font-weight="800" fill="#C2410C" text-anchor="middle">여기엔 차를 못 세워요</text>

  <!-- P1 단기주차장 -->
  <rect x="14" y="252" width="452" height="134" rx="14" fill="#D6EEDC"/>
  <text x="30" y="284" font-size="20" font-weight="800" fill="#0D6A40">P1 단기주차장</text>
  <text x="30" y="305" font-size="13" font-weight="700" fill="#3D6B52">터미널 바로 앞</text>
  <text x="30" y="344" font-size="16" font-weight="800" fill="#22313F">③ 같이 걸어가서 차 타요</text>
  <text x="30" y="366" font-size="13" font-weight="700" fill="#4F5B66">카니발 7인승 · 민석 차</text>
  <g>
    <path d="M352 318 L364 300 Q368 296 374 296 L408 296 Q414 296 418 300 L430 318 Z" fill="#5B3FC4"/>
    <path d="M362 316 L370 303 L388 303 L388 316 Z M394 316 L394 303 L410 303 L420 316 Z" fill="#E9E4FF"/>
    <rect x="336" y="316" width="112" height="34" rx="10" fill="#7B5CD6"/>
    <circle cx="362" cy="352" r="10" fill="#2A2A33"/><circle cx="362" cy="352" r="4" fill="#C9CED4"/>
    <circle cx="422" cy="352" r="10" fill="#2A2A33"/><circle cx="422" cy="352" r="4" fill="#C9CED4"/>
  </g>
  <text x="466" y="379" font-size="11" font-weight="600" fill="#6E8478" text-anchor="end">그림은 대략적인 위치예요</text>

  <!-- 걸어가는 길 -->
  <polyline points="253,150 253,246 253,276 326,318" fill="none" stroke="#F28C28" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 10"/>

  <!-- 만나는 곳 -->
  <circle cx="253" cy="144" r="14" fill="#F28C28"/>
  <circle cx="253" cy="144" r="5" fill="#FFFFFF"/>
  <text x="275" y="146" font-size="15" font-weight="800" fill="#A14C0B">② 나온 출구 앞에서 만나요</text>
  <text x="275" y="166" font-size="12.5" font-weight="700" fill="#6B7684">출구 번호는 단톡방에 보내 주세요</text>
</svg>
